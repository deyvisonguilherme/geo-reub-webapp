<p-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '90vw', 'max-width': '1080px' }"
  [breakpoints]="{ '960px': '95vw' }"
  styleClass="nucleus-dialog"
  [closable]="false"
>
  <ng-template pTemplate="header">
    <div class="dialog-header-custom">
      <div>
        <h2 class="section-title">{{ title }}</h2>
        <p class="section-subtitle">
          Preencha os dados cadastrais, técnicos e de georreferenciamento do núcleo urbano.
        </p>
      </div>
      <p-button
        icon="pi pi-times"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        (onClick)="close()"
      />
    </div>
  </ng-template>

  @if (model) {
    <div class="form-grid">
      <!-- Identificação -->
      <div class="field-span-full">
        <h3 class="section-title text-sm mt-2 mb-1">Identificação</h3>
      </div>
      <div class="form-field">
        <label for="codigo">Código</label>
        <input
          id="codigo"
          type="text"
          pInputText
          [(ngModel)]="model.codigo"
          placeholder="Código do núcleo"
        />
      </div>
      <div class="form-field field-span-2">
        <label for="nome">Nome</label>
        <input
          id="nome"
          type="text"
          pInputText
          [(ngModel)]="model.nome"
          placeholder="Nome do núcleo urbano"
        />
      </div>
      <div class="form-field field-span-full">
        <label for="descricao">Descrição</label>
        <textarea
          id="descricao"
          pTextarea
          rows="3"
          [(ngModel)]="model.descricao"
          placeholder="Breve descrição do núcleo"
        ></textarea>
      </div>

      <!-- Caracterização -->
      <div class="field-span-full">
        <h3 class="section-title text-sm mt-4 mb-1">Caracterização</h3>
      </div>
      <div class="form-field">
        <label for="situacaoGeografica">Situação geográfica</label>
        <select id="situacaoGeografica" [(ngModel)]="model.situacaoGeografica" class="p-inputtext">
          <option value="">Selecione</option>
          @for (option of situacaoOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
      <div class="form-field">
        <label for="areaTotalM2">Área total (m²)</label>
        <p-inputnumber
          id="areaTotalM2"
          [(ngModel)]="model.areaTotalM2"
          mode="decimal"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
        />
      </div>
      <div class="form-field">
        <label for="perimetroM">Perímetro (m)</label>
        <p-inputnumber
          id="perimetroM"
          [(ngModel)]="model.perimetroM"
          mode="decimal"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
        />
      </div>
      <div class="form-field">
        <label for="numeroFamiliasEstimado">Famílias estimadas</label>
        <p-inputnumber
          id="numeroFamiliasEstimado"
          [(ngModel)]="model.numeroFamiliasEstimado"
          [useGrouping]="false"
        />
      </div>
      <div class="form-field">
        <label for="dataOcupacaoInicial">Data de ocupação inicial</label>
        <p-datepicker
          id="dataOcupacaoInicial"
          [(ngModel)]="model.dataOcupacaoInicial"
          dateFormat="dd/mm/yy"
          appendTo="body"
          [showIcon]="true"
        />
      </div>
      <div class="form-field">
        <label for="municipioId">Município ID</label>
        <input id="municipioId" type="text" pInputText [(ngModel)]="model.municipioId" />
      </div>

      <div class="checkbox-grid field-span-full">
        <div class="checkbox-field">
          <p-checkbox id="consolidado" [binary]="true" [(ngModel)]="model.consolidado" />
          <label for="consolidado">Núcleo Consolidado</label>
        </div>
      </div>

      <!-- Georreferenciamento -->
      <div class="field-span-full">
        <h3 class="section-title text-sm mt-4 mb-1">Georreferenciamento</h3>
      </div>
      <div class="form-field field-span-full">
        <label for="poligonalGeorreferenciada">Poligonal georreferenciada</label>
        <textarea
          id="poligonalGeorreferenciada"
          pTextarea
          rows="3"
          [(ngModel)]="model.poligonalGeorreferenciada"
          placeholder="WKT ou coordenadas da poligonal"
        ></textarea>
      </div>
      <div class="form-field field-span-full">
        <label for="centroide">Centroide</label>
        <textarea
          id="centroide"
          pTextarea
          rows="2"
          [(ngModel)]="model.centroide"
          placeholder="Coordenada central"
        ></textarea>
      </div>

      <!-- Auditoria -->
      <div class="field-span-full">
        <h3 class="section-title text-sm mt-4 mb-1">Auditoria</h3>
      </div>
      <div class="form-field">
        <label for="criadoPor">Criado por</label>
        <input id="criadoPor" type="text" pInputText [(ngModel)]="model.criadoPor" />
      </div>
      <div class="form-field">
        <label for="atualizadoPor">Atualizado por</label>
        <input id="atualizadoPor" type="text" pInputText [(ngModel)]="model.atualizadoPor" />
      </div>
    </div>

    <div class="form-actions">
      <p-button
        label="Cancelar"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        (onClick)="close()"
      />
      <p-button
        label="Salvar Núcleo"
        icon="pi pi-check"
        [rounded]="true"
        [disabled]="saveDisabled"
        (onClick)="submit()"
      />
    </div>
  }
</p-dialog>
