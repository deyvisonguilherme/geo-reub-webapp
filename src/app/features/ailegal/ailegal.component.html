<div class="chat-window shadow-8">
  <div class="chat-header">
    <div class="header-info">
      <i class="pi pi-android robot-icon"></i>
      <div>
        <span class="chat-title">AIlegal - Assistente</span>
        <span class="chat-status">Online agora</span>
      </div>
    </div>
    <p-button
      icon="pi pi-times"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (onClick)="close.emit()"
    />
  </div>

  <p-scrollpanel [style]="{ width: '100%', height: '320px' }" styleClass="chat-content">
    <div class="messages-container">
      @for (msg of messages(); track msg.timestamp) {
        <div class="message-wrapper" [ngClass]="msg.sender">
          <div class="message-bubble">
            {{ msg.text }}
            <span class="message-time">{{ msg.timestamp | date: 'HH:mm' }}</span>
          </div>
        </div>
      }
    </div>
  </p-scrollpanel>

  <div class="chat-footer">
    <div class="p-inputgroup">
      <input
        type="text"
        pInputText
        [(ngModel)]="newMessage"
        placeholder="Digite sua dúvida..."
        (keyup.enter)="sendMessage()"
      />
      <p-button icon="pi pi-send" (onClick)="sendMessage()" [disabled]="!newMessage.trim()" />
    </div>
  </div>
</div>
