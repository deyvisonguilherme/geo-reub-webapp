<section class="card">
  <div class="section-header">
    <div>
      <h2 class="section-title">Pesquisa Dominialidade</h2>
      <p class="section-subtitle">
        Identificação de matrículas, cartório, titularidade e sobreposições da área ocupada.
      </p>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-field">
      <label for="matriculaBase">Matrícula base</label>
      <input id="matriculaBase" type="text" pInputText [(ngModel)]="draft.matriculaBase" />
    </div>
    <div class="form-field">
      <label for="cartorioRegistro">Cartório de registro</label>
      <input id="cartorioRegistro" type="text" pInputText [(ngModel)]="draft.cartorioRegistro" />
    </div>
    <div class="form-field">
      <label for="elaboradoPor">Elaborado por</label>
      <input id="elaboradoPor" type="text" pInputText [(ngModel)]="draft.elaboradoPor" />
    </div>
    <div class="form-field">
      <label for="dataElaboracao">Data de elaboração</label>
      <p-datepicker
        id="dataElaboracao"
        [(ngModel)]="draft.dataElaboracao"
        dateFormat="dd/mm/yy"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="form-field field-span-2">
      <label for="arquivoPlantaSobreposicaoId">Arquivo planta sobreposição ID</label>
      <input
        id="arquivoPlantaSobreposicaoId"
        type="text"
        pInputText
        [(ngModel)]="draft.arquivoPlantaSobreposicaoId"
      />
    </div>
    <div class="form-field field-span-2">
      <label for="arquivoCertidaoMatriculaId">Arquivo certidão matrícula ID</label>
      <input
        id="arquivoCertidaoMatriculaId"
        type="text"
        pInputText
        [(ngModel)]="draft.arquivoCertidaoMatriculaId"
      />
    </div>
    <div class="form-field field-span-full">
      <label for="situacaoDominial">Situação dominial</label>
      <textarea id="situacaoDominial" pTextarea [(ngModel)]="draft.situacaoDominial" rows="3"></textarea>
    </div>
    <div class="form-field field-span-full">
      <label for="descricaoSobreposicoes">Descrição sobreposições</label>
      <textarea
        id="descricaoSobreposicoes"
        pTextarea
        [(ngModel)]="draft.descricaoSobreposicoes"
        rows="3"
      ></textarea>
    </div>
  </div>

  <div class="checkbox-grid">
    <div class="checkbox-field">
      <p-checkbox
        inputId="proprietarioIdentificado"
        [binary]="true"
        [(ngModel)]="draft.proprietarioIdentificado"
      />
      <label for="proprietarioIdentificado">Proprietário identificado</label>
    </div>
    <div class="checkbox-field">
      <p-checkbox inputId="areaPublica" [binary]="true" [(ngModel)]="draft.areaPublica" />
      <label for="areaPublica">Área pública</label>
    </div>
    <div class="checkbox-field">
      <p-checkbox inputId="areaPrivada" [binary]="true" [(ngModel)]="draft.areaPrivada" />
      <label for="areaPrivada">Área privada</label>
    </div>
    <div class="checkbox-field">
      <p-checkbox inputId="possuiSobreposicao" [binary]="true" [(ngModel)]="draft.possuiSobreposicao" />
      <label for="possuiSobreposicao">Possui sobreposição</label>
    </div>
  </div>

  <div class="form-actions">
    <p-button label="Salvar Etapa" [text]="true" [rounded]="true" (onClick)="submit()" />
  </div>
</section>
