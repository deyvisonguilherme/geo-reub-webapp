<section class="card">
  <div class="section-header">
    <div>
      <h2 class="section-title">Estudo Técnico Preliminar</h2>
      <p class="section-subtitle">
        Levantamentos técnicos, risco, remoções necessárias e aprovação preliminar.
      </p>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-field">
      <label for="tipoEstudo">Tipo de estudo</label>
      <input id="tipoEstudo" type="text" pInputText [(ngModel)]="draft.tipoEstudo" />
    </div>
    <div class="form-field">
      <label for="titulo">Título</label>
      <input id="titulo" type="text" pInputText [(ngModel)]="draft.titulo" />
    </div>
    <div class="form-field">
      <label for="nivelRisco">Nível de risco</label>
      <input id="nivelRisco" type="text" pInputText [(ngModel)]="draft.nivelRisco" />
    </div>
    <div class="form-field">
      <label for="familiasAfetadas">Famílias afetadas</label>
      <p-inputnumber
        inputId="familiasAfetadas"
        [(ngModel)]="draft.familiasAfetadas"
        [useGrouping]="false"
      />
    </div>
    <div class="form-field">
      <label for="responsavelTecnico">Responsável técnico</label>
      <input id="responsavelTecnico" type="text" pInputText [(ngModel)]="draft.responsavelTecnico" />
    </div>
    <div class="form-field">
      <label for="registroProfissional">Registro profissional</label>
      <input
        id="registroProfissional"
        type="text"
        pInputText
        [(ngModel)]="draft.registroProfissional"
      />
    </div>
    <div class="form-field">
      <label for="arquivoEstudoId">Arquivo estudo ID</label>
      <input id="arquivoEstudoId" type="text" pInputText [(ngModel)]="draft.arquivoEstudoId" />
    </div>
    <div class="form-field">
      <label for="dataElaboracao">Data elaboração</label>
      <p-datepicker
        id="dataElaboracao"
        [(ngModel)]="draft.dataElaboracao"
        dateFormat="dd/mm/yy"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="form-field">
      <label for="dataAprovacao">Data aprovação</label>
      <p-datepicker
        id="dataAprovacao"
        [(ngModel)]="draft.dataAprovacao"
        dateFormat="dd/mm/yy"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="form-field field-span-full">
      <label for="resumoExecutivo">Resumo executivo</label>
      <textarea id="resumoExecutivo" pTextarea [(ngModel)]="draft.resumoExecutivo" rows="3"></textarea>
    </div>
    <div class="form-field field-span-full">
      <label for="conclusoes">Conclusões</label>
      <textarea id="conclusoes" pTextarea [(ngModel)]="draft.conclusoes" rows="3"></textarea>
    </div>
    <div class="form-field field-span-full">
      <label for="recomendacoes">Recomendações</label>
      <textarea id="recomendacoes" pTextarea [(ngModel)]="draft.recomendacoes" rows="3"></textarea>
    </div>
  </div>

  <div class="checkbox-grid">
    <div class="checkbox-field">
      <p-checkbox inputId="necessitaRemocao" [binary]="true" [(ngModel)]="draft.necessitaRemocao" />
      <label for="necessitaRemocao">Necessita remoção</label>
    </div>
  </div>

  <div class="form-actions">
    <p-button label="Salvar Etapa" [rounded]="true" [text]="true" (onClick)="submit()" />
  </div>
</section>
